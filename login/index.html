<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pampa Meats — Partner Login</title>
<style>
:root{--bg:#0A0A0A;--gold:#C9A55C;--panel:#151515;--line:#2a2a2a;--txt:#EDE8DF;--mut:#9a9488}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(1200px 600px at 50% -10%, #1a1712, #0A0A0A 60%);color:var(--txt);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
.card{width:100%;max-width:400px;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:36px 30px;box-shadow:0 30px 80px rgba(0,0,0,.55)}
.brand{text-align:center;letter-spacing:5px;color:var(--gold);font-weight:700;font-size:20px}
.sub{text-align:center;color:var(--mut);font-size:11px;letter-spacing:2px;text-transform:uppercase;margin:6px 0 26px}
label{display:block;font-size:11px;letter-spacing:1px;text-transform:uppercase;color:var(--mut);margin:16px 0 6px}
input{width:100%;padding:13px 14px;background:#0e0e0e;border:1px solid var(--line);border-radius:10px;color:var(--txt);font-size:15px;outline:none}
input:focus{border-color:var(--gold)}
button{width:100%;margin-top:24px;padding:14px;background:var(--gold);color:#0A0A0A;border:0;border-radius:10px;font-weight:700;font-size:15px;letter-spacing:.5px;cursor:pointer}
button:disabled{opacity:.6;cursor:default}
.msg{margin-top:16px;font-size:13px;text-align:center;min-height:18px}
.msg.err{color:#e0736b}.msg.ok{color:#7fc99a}
.foot{margin-top:22px;text-align:center;color:var(--mut);font-size:11px;letter-spacing:.5px;line-height:1.6}
</style></head><body>
<form class="card" id="f" autocomplete="on">
  <div class="brand">PAMPA MEATS</div>
  <div class="sub">Partner Access</div>
  <label for="email">Email</label>
  <input id="email" name="email" type="email" autocomplete="username" required>
  <label for="password">Password</label>
  <input id="password" name="password" type="password" autocomplete="current-password" required>
  <button id="btn" type="submit">Sign in</button>
  <div class="msg" id="msg"></div>
  <div class="foot">First time here? Use the personal setup link we emailed you.</div>
</form>
<script>
var f=document.getElementById('f'),msg=document.getElementById('msg'),btn=document.getElementById('btn');
f.addEventListener('submit',function(e){
  e.preventDefault();
  msg.className='msg';msg.textContent='';btn.disabled=true;btn.textContent='Signing in...';
  var email=document.getElementById('email').value.trim();
  var password=document.getElementById('password').value;
  fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:email,password:password})})
   .then(function(r){return r.json()})
   .then(function(d){
     if(d && d.ok){ msg.className='msg ok'; msg.textContent='Welcome'+(d.name?', '+d.name:'')+'. Loading...'; window.location.href='/dashboard'; }
     else { var m = (d && d.reason==='needs_setup') ? 'This account still needs setup. Use your setup link.' : 'Wrong email or password.'; msg.className='msg err'; msg.textContent=m; btn.disabled=false; btn.textContent='Sign in'; }
   })
   .catch(function(){ msg.className='msg err'; msg.textContent='Connection error. Please try again.'; btn.disabled=false; btn.textContent='Sign in'; });
});
</script>
</body></html>
