<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#000000">
<title>Pampa Meats · Expenses</title>
<link rel="icon" type="image/png" href="/logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.5.0/dist/tabler-icons.min.css">
<style>
*,*::before,*::after{box-sizing:border-box}
body{margin:0;font-family:'Inter',-apple-system,BlinkMacSystemFont,sans-serif;background:#0A0A0A;color:#F5EFE5;line-height:1.55;-webkit-font-smoothing:antialiased}
.serif{font-family:'Cormorant Garamond',Georgia,serif}
a{color:inherit;text-decoration:none}
input,textarea,select,button{font-family:inherit}
.top{display:flex;justify-content:space-between;align-items:center;padding:16px 22px;border-bottom:0.5px solid #242424;background:#000;position:sticky;top:0;z-index:50}
.top .brand{font-family:'Cormorant Garamond',serif;font-size:17px;font-weight:600;letter-spacing:2.5px;color:#C9A55C}
.top .brand span{color:#6E6347;font-weight:400}
.top a.back{font-size:11px;letter-spacing:1.2px;color:#8A7548}
.wrap{max-width:900px;margin:0 auto;padding:24px 18px 80px}
.hd{margin:4px 0 18px}
.hd .eyebrow{font-size:10px;letter-spacing:3.5px;color:#8A7548;margin-bottom:8px}
.hd h1{font-family:'Cormorant Garamond',serif;font-weight:500;font-size:29px;margin:0 0 6px;color:#F5EFE5}
.hd p{margin:0;font-size:13px;color:#9A8F76}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:18px}
.kpi{background:#141414;border:0.5px solid #262626;border-radius:8px;padding:13px 14px}
.kpi .l{font-size:10px;letter-spacing:1.5px;text-transform:uppercase;color:#8A7548}
.kpi .v{font-family:'Cormorant Garamond',serif;font-size:23px;color:#F5EFE5;margin-top:4px}
.card{background:#121212;border:0.5px solid #262626;border-radius:10px;padding:8px 4px;margin-bottom:16px;overflow-x:auto}
.clabel{display:flex;align-items:center;gap:8px;font-size:11px;letter-spacing:2px;color:#8A7548;text-transform:uppercase;padding:12px 14px 4px}
.clabel i{color:#C9A55C;font-size:15px}
table{width:100%;border-collapse:collapse;font-size:13px;min-width:560px}
th{text-align:left;font-size:10px;letter-spacing:1px;text-transform:uppercase;color:#8A7548;font-weight:600;padding:10px 12px;border-bottom:1px solid #C9A55C}
td{padding:10px 12px;border-bottom:0.5px solid #1E1E1E;color:#B8A985}
td.r{text-align:right;font-variant-numeric:tabular-nums}
td.who{color:#F5EFE5;font-weight:600}
.tag{display:inline-block;padding:2px 9px;border-radius:10px;font-size:11px;background:#1A1A1A;border:0.5px solid #2E2E2E;color:#B8A985}
.formcard{background:#121212;border:0.5px solid #262626;border-radius:10px;padding:18px}
.who-pills{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:12px}
.who-pills button{background:#1A1A1A;border:0.5px solid #2E2E2E;color:#B8A985;padding:11px 6px;border-radius:8px;font-size:13px;font-weight:500;cursor:pointer}
.who-pills button.sel{background:#C9A55C;border-color:#C9A55C;color:#1A1208;font-weight:600}
.row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
.field{margin-bottom:12px}
.field label{display:block;font-size:11px;letter-spacing:1px;color:#9A8F76;margin-bottom:5px;text-transform:uppercase}
.field input,.field select{width:100%;background:#0C0C0C;border:0.5px solid #2E2E2E;border-radius:8px;color:#F5EFE5;padding:11px 12px;font-size:14px}
.btn{background:#C9A55C;color:#1A1208;border:none;border-radius:8px;padding:12px 20px;font-size:14px;font-weight:600;cursor:pointer}
.banner{display:none;border-radius:8px;padding:11px 14px;margin-bottom:14px;font-size:13px}
.banner.err{display:block;background:#1f0f0e;border:0.5px solid #5C2B27;color:#E9A8A2}
.banner.ok{display:block;background:#0E1812;border:0.5px solid #1F5A38;color:#9FE1CB}
.loading{color:#8A7548;font-size:13px;padding:20px;text-align:center}
@media(max-width:560px){.kpis{grid-template-columns:1fr 1fr}.row3,.who-pills{grid-template-columns:1fr 1fr}}
</style>
</head>
<body>
<div class="top">
<div class="brand">PAMPA MEATS <span>· Expenses</span></div>
<a class="back" href="/dashboard">&larr; Backend</a>
</div>
<div class="wrap">
<div class="hd">
<div class="eyebrow">BUSINESS EXPENSES</div>
<h1 class="serif">Expenses</h1>
<p>Each partner logs business expenses here. Totals feed the Gross Profit view.</p>
</div>

<div id="banner" class="banner"></div>

<div class="kpis" id="kpis">
<div class="kpi"><div class="l">Total</div><div class="v" id="k-all">$0</div></div>
<div class="kpi"><div class="l">Mati</div><div class="v" id="k-Mati">$0</div></div>
<div class="kpi"><div class="l">Jay</div><div class="v" id="k-Jay">$0</div></div>
<div class="kpi"><div class="l">Jan</div><div class="v" id="k-Jan">$0</div></div>
</div>

<div class="card">
<div class="clabel"><i class="ti ti-receipt"></i> Expenses</div>
<table>
<thead><tr><th>Date</th><th>Partner</th><th>Category</th><th>Description</th><th class="r">Amount</th></tr></thead>
<tbody id="rows"><tr><td colspan="5" class="loading">Loading…</td></tr></tbody>
</table>
</div>

<div class="formcard">
<div class="clabel" style="padding:0 0 12px"><i class="ti ti-plus"></i> Log an expense</div>
<div class="who-pills" id="who">
<button type="button" data-w="Mati">Mati</button>
<button type="button" data-w="Jay">Jay</button>
<button type="button" data-w="Jan">Jan</button>
<button type="button" data-w="Mark">Mark</button>
</div>
<div class="row3">
<div class="field"><label>Category</label><select id="f-cat"><option>Delivery</option><option>Packaging</option><option>Fuel</option><option>Marketing</option><option>Supplies</option><option>Fees</option><option>Other</option></select></div>
<div class="field"><label>Amount $</label><input id="f-amt" type="number" min="0" step="0.01" placeholder="0.00"></div>
<div class="field"><label>Date</label><input id="f-date" type="date"></div>
</div>
<div class="field"><label>Description</label><input id="f-desc" type="text" placeholder="e.g. cold boxes, gas, IG ad..."></div>
<button class="btn" id="f-save">Add expense</button>
</div>
</div>

<script>
(function(){
var $=function(id){return document.getElementById(id);};
var money=function(n){return '$'+(Math.round((Number(n)||0)*100)/100).toLocaleString(undefined,{minimumFractionDigits:0,maximumFractionDigits:2});};
var who=null;
function banner(cls,msg){ var b=$('banner'); b.className='banner '+cls; b.textContent=msg; window.scrollTo({top:0,behavior:'smooth'}); }

function render(exp){
var tb=$('rows');
var by={Mati:0,Jay:0,Jan:0,Mark:0}, all=0;
exp.forEach(function(e){ all+=e.amount; if(by[e.partner]!=null) by[e.partner]+=e.amount; });
$('k-all').textContent=money(all); $('k-Mati').textContent=money(by.Mati); $('k-Jay').textContent=money(by.Jay); $('k-Jan').textContent=money(by.Jan);
if(!exp.length){ tb.innerHTML='<tr><td colspan="5" class="loading">No expenses yet. Log the first below.</td></tr>'; return; }
exp.sort(function(a,b){ return (b.date||'').localeCompare(a.date||''); });
tb.innerHTML=exp.map(function(e){
return '<tr><td>'+(e.date||'')+'</td><td class="who">'+(e.partner||'—')+'</td>'+
'<td><span class="tag">'+(e.category||'—')+'</span></td><td>'+(e.expense||'')+'</td>'+
'<td class="r">'+money(e.amount)+'</td></tr>';
}).join('');
}

function load(){
fetch('/api/expenses').then(function(r){return r.json();}).then(function(d){
if(d&&d.ok){ render(d.expenses||[]); }
else { $('rows').innerHTML='<tr><td colspan="5" class="loading">Could not load ('+((d&&d.reason)||'error')+').</td></tr>'; }
}).catch(function(){ $('rows').innerHTML='<tr><td colspan="5" class="loading">Connection error.</td></tr>'; });
}

$('who').addEventListener('click',function(e){
var b=e.target.closest('button'); if(!b) return;
who=b.getAttribute('data-w');
document.querySelectorAll('#who button').forEach(function(x){x.classList.toggle('sel',x===b);});
});

$('f-save').addEventListener('click',function(){
var amt=parseFloat($('f-amt').value);
if(!who){ banner('err','Pick who is logging the expense.'); return; }
if(!(amt>0)){ banner('err','Enter the amount.'); return; }
$('f-save').disabled=true;
fetch('/api/expenses',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({
partner:who, category:$('f-cat').value, amount:amt, date:$('f-date').value||'', expense:$('f-desc').value.trim()
})}).then(function(r){return r.json();}).then(function(d){
$('f-save').disabled=false;
if(d&&d.ok){ banner('ok','Expense logged ✓'); $('f-amt').value=''; $('f-desc').value=''; load(); }
else { banner('err','Could not save ('+((d&&d.reason)||'error')+').'); }
}).catch(function(){ $('f-save').disabled=false; banner('err','Connection error.'); });
});

load();
})();
</script>
</body>
</html>
