<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Pampa Meats · Customers</title>
<link rel="icon" type="image/png" href="/logo.png">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box}
body{margin:0;font-family:'Inter',-apple-system,BlinkMacSystemFont,sans-serif;background:#0A0A0A;color:#F5EFE5;line-height:1.55;-webkit-font-smoothing:antialiased}
.serif{font-family:'Cormorant Garamond',Georgia,serif}
a{color:inherit;text-decoration:none}
.top{display:flex;justify-content:space-between;align-items:center;padding:16px 22px;border-bottom:0.5px solid #242424;background:#000;position:sticky;top:0;z-index:50}
.top .brand{font-family:'Cormorant Garamond',serif;font-size:17px;font-weight:600;letter-spacing:2.5px;color:#C9A55C}
.top .brand span{color:#6E6347;font-weight:400}
.top a.back{display:inline-flex;align-items:center;gap:6px;font-size:12px;letter-spacing:.5px;color:#C9A55C;border:1px solid #C9A55C;border-radius:8px;padding:7px 14px;font-weight:500}
.wrap{max-width:1000px;margin:0 auto;padding:24px 18px 80px}
.hd{margin:4px 0 18px}
.hd .eyebrow{font-size:10px;letter-spacing:3.5px;color:#8A7548;margin-bottom:8px}
.hd h1{font-family:'Cormorant Garamond',serif;font-weight:500;font-size:29px;margin:0 0 6px;color:#F5EFE5}
.hd p{margin:0;font-size:13px;color:#9A8F76}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:16px}
.kpi{background:#141414;border:0.5px solid #262626;border-radius:8px;padding:13px 14px}
.kpi .l{font-size:10px;letter-spacing:1.5px;text-transform:uppercase;color:#8A7548}
.kpi .v{font-family:'Cormorant Garamond',serif;font-size:23px;color:#F5EFE5;margin-top:4px}
.kpi.due .v{color:#E9A8A2}
.tabs{display:flex;gap:8px;margin-bottom:10px;flex-wrap:wrap}
.tabs button{background:#1A1A1A;border:0.5px solid #2E2E2E;color:#B8A985;padding:7px 14px;border-radius:8px;font-size:13px;cursor:pointer;font-family:inherit}
.tabs button.sel{background:#C9A55C;border-color:#C9A55C;color:#1A1208;font-weight:600}
.card{background:#121212;border:0.5px solid #262626;border-radius:10px;padding:8px 4px;overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13px;min-width:680px}
th{text-align:left;font-size:10px;letter-spacing:1px;text-transform:uppercase;color:#8A7548;font-weight:600;padding:10px 12px;border-bottom:1px solid #C9A55C}
td{padding:10px 12px;border-bottom:0.5px solid #1E1E1E;color:#B8A985;vertical-align:top}
td.r{text-align:right;font-variant-numeric:tabular-nums}
td.cust{color:#F5EFE5;font-weight:600}
td .sub{font-size:11px;color:#6E6347;display:block;margin-top:2px}
.loading{color:#8A7548;font-size:13px;padding:20px;text-align:center}
.rc{font-size:10.5px;padding:3px 8px;border-radius:12px;white-space:nowrap}
.rc.due{background:#2a1414;color:#E9A8A2;border:0.5px solid #5a2a2a}
.rc.never{background:#2a2110;color:#F0C468;border:0.5px solid #5a4a22}
.rc.lapsed{background:#1c1a12;color:#C9A55C;border:0.5px solid #3a352b}
.rc.ok{background:#13210f;color:#8fc99a;border:0.5px solid #2c5a2c}
.wa{font-size:11px;color:#7fc99a;border:0.5px solid #2c5a2c;border-radius:6px;padding:3px 8px}
.vipstar{color:#F0C468}
.tag{font-size:10px;padding:2px 7px;border-radius:10px;border:0.5px solid #3a352b;color:#B8A985}
.tag.us{background:#141c26;color:#8fb6e9;border-color:#2c4a6a}
.tag.ko{background:#1c1a12;color:#C9A55C;border-color:#3a352b}
.note{background:#12100a;border:0.5px solid #3a352b;border-radius:10px;padding:14px 16px;margin:0 4px 12px;font-size:13px;color:#EDE3CC}
.note b{color:#C9A55C}
.actrow{background:rgba(240,196,104,.06)}
@media(max-width:560px){.kpis{grid-template-columns:1fr 1fr}}
html{scroll-behavior:smooth}
body{background:radial-gradient(1100px 520px at 50% -160px,#16130c 0%,#0A0A0A 60%) no-repeat #0A0A0A;background-attachment:fixed}
tbody tr{transition:background .15s ease}tbody tr:hover{background:rgba(201,165,92,.05)}
</style>
</head>
<body>
<div class="top">
<div class="brand">PAMPA MEATS <span>· Customers</span></div>
<a class="back" href="/dashboard">Main menu</a>
</div>
<div class="wrap">
<div class="hd">
<div class="eyebrow">CRM · CUSTOMERS</div>
<h1 class="serif">Customers</h1>
<p>Your customer base, built from every order — with follow-ups, reorder timing, feedback and who to contact today.</p>
</div>
<div class="kpis">
<div class="kpi"><div class="l">Customers</div><div class="v" id="k-count">0</div></div>
<div class="kpi"><div class="l">Total spent</div><div class="v" id="k-spent">$0</div></div>
<div class="kpi"><div class="l">Avg / customer</div><div class="v" id="k-avg">$0</div></div>
<div class="kpi due"><div class="l">Owes you</div><div class="v" id="k-owe">$0</div></div>
</div>
<div class="tabs">
<button id="t-followup" class="sel">To contact today</button>
<button id="t-occasions">Occasions</button>
<button id="t-all">All</button>
<button id="t-owe">Owe money</button>
<button id="t-lapsed">Lapsed (30d+)</button>
</div>
<div class="card" id="card"><div class="loading">Loading…</div></div>
</div>
<script>
(function(){
var $=function(id){return document.getElementById(id);};
var money=function(n){return '$'+(Math.round((Number(n)||0)*100)/100).toLocaleString(undefined,{minimumFractionDigits:0,maximumFractionDigits:2});};
var esc=function(s){return String(s==null?'':s);};
var digits=function(s){return String(s==null?'':s).replace(/[^0-9]/g,'');};
var fmtDate=function(d){ if(!d) return ''; var x=new Date(d); if(isNaN(x.getTime())) return String(d).slice(0,10); return x.toLocaleDateString('en-US',{year:'numeric',month:'short',day:'numeric'}); };
var CUST=[], FUP=null, mode='followup';
var DAY=86400000, TODAY=new Date().toISOString().slice(0,10);
function dt(o){ return o.date||o.deliveryDate||o.created||''; }
function bal(o){ return (o.balance!=null)?Number(o.balance):(Number(o.total||0)-Number(o.amountPaid||0)); }
function emoji(r){ if(r==='Good')return '\uD83D\uDE0A'; if(r==='Neutral')return '\uD83D\uDE10'; if(r==='Bad')return '\u2639\uFE0F'; return ''; }
var HOLIDAYS=[
 {n:'Labor Day', d:'2026-09-07', t:'US', big:true},
 {n:'Rosh Hashanah', d:'2026-09-11', t:'Kosher', big:true},
 {n:'Yom Kippur (break-fast)', d:'2026-09-20', t:'Kosher', big:false},
 {n:'Sukkot', d:'2026-09-25', t:'Kosher', big:true},
 {n:'Thanksgiving', d:'2026-11-26', t:'US', big:false},
 {n:'Hanukkah', d:'2026-12-04', t:'Kosher', big:false},
 {n:'Christmas', d:'2026-12-25', t:'US', big:false},
 {n:"New Year's Day", d:'2027-01-01', t:'US', big:false},
 {n:'Super Bowl LXI', d:'2027-02-14', t:'US', big:true},
 {n:'Purim', d:'2027-03-22', t:'Kosher', big:false},
 {n:'Passover (Pesach)', d:'2027-04-21', t:'Kosher', big:true},
 {n:'Memorial Day', d:'2027-05-31', t:'US', big:true},
 {n:'Shavuot', d:'2027-06-10', t:'Kosher', big:false},
 {n:"Father's Day", d:'2027-06-20', t:'US', big:true},
 {n:'July 4th', d:'2027-07-04', t:'US', big:true}
];
function build(orders){
  var map={};
  orders.forEach(function(o){
    var nm=(o.name||o.customer||'').trim();
    if(/test/i.test(nm)) return;
    var email=(o.email||'').trim().toLowerCase();
    if(!nm && !email) return;
    var keyk=email||('name:'+nm.toLowerCase());
    if(!map[keyk]) map[keyk]={name:nm||email, email:o.email||'', phone:o.phone||'', orders:0, spent:0, paid:0, owes:0, last:''};
    var c=map[keyk];
    if(nm && !/test/i.test(nm)) c.name=nm;
    if(o.email && !c.email) c.email=o.email;
    if(o.phone && !c.phone) c.phone=o.phone;
    c.orders++; c.spent+=Number(o.total||0); c.paid+=Number(o.amountPaid||0); c.owes+=Math.max(0,bal(o));
    var d=dt(o); if(d && d>c.last) c.last=d;
  });
  return Object.keys(map).map(function(k){return map[k];});
}
function renderStd(){
  var list=CUST.slice(); var now=Date.now();
  if(mode==='owe') list=list.filter(function(c){return c.owes>0.005;});
  if(mode==='lapsed') list=list.filter(function(c){ if(!c.last) return true; return (now-new Date(c.last).getTime())>30*DAY; });
  list.sort(function(a,b){return b.spent-a.spent;});
  if(!list.length){ $('card').innerHTML='<div class="loading">No customers'+(mode==='all'?' yet.':' in this view.')+'</div>'; return; }
  var rows=list.map(function(c){
    var contact=(c.email?c.email:'')+(c.phone?('<span class="sub">'+c.phone+'</span>'):''); if(!c.email&&c.phone) contact=c.phone;
    return '<tr><td class="cust"><a href="/dashboard/customer?c='+encodeURIComponent(c.phone||'')+'" style="color:#C9A55C">'+(esc(c.name)||'—')+'</a></td>'+
      '<td>'+(contact||'<span class="sub">no contact</span>')+'</td>'+
      '<td class="r">'+c.orders+'</td><td class="r">'+money(c.spent)+'</td>'+
      '<td class="r" style="color:#E9A8A2">'+(c.owes>0.005?money(c.owes):'—')+'</td><td>'+(c.last?fmtDate(c.last):'—')+'</td><td>'+(digits(c.phone)?('<a class="wa" href="https://wa.me/'+digits(c.phone)+'" target="_blank">WhatsApp</a>'):'')+'</td></tr>';
  }).join('');
  $('card').innerHTML='<table><thead><tr><th>Customer</th><th>Contact</th><th class="r">Orders</th><th class="r">Spent</th><th class="r">Owes</th><th>Last order</th><th></th></tr></thead><tbody>'+rows+'</tbody></table>';
}
function classify(c){
  if(c.nextFollowup){ if(String(c.nextFollowup).slice(0,10)<=TODAY) return {p:0,cls:'due',txt:'Planned contact due'}; return {p:6,cls:'ok',txt:'Scheduled '+String(c.nextFollowup).slice(0,10)}; }
  if(c.reorderDays!=null && c.reorderDays<=0) return {p:1,cls:'due',txt:'Due for reorder'};
  if(!c.lastContact) return {p:2,cls:'never',txt:'Never contacted'};
  if(c.daysSince!=null && c.daysSince>=30) return {p:3,cls:'lapsed',txt:'No order '+c.daysSince+'d'};
  if(c.reorderDays!=null && c.reorderDays<=14) return {p:4,cls:'never',txt:'Reorder in '+c.reorderDays+'d'};
  return {p:7,cls:'ok',txt:'Up to date'};
}
function renderFollowups(){
  if(!FUP){ $('card').innerHTML='<div class="loading">Loading queue…</div>'; return; }
  var list=FUP.slice();
  list.forEach(function(c){ c._r=classify(c); });
  list.sort(function(a,b){ if(a._r.p!==b._r.p) return a._r.p-b._r.p; if(a._r.p===0) return String(a.nextFollowup).localeCompare(String(b.nextFollowup)); return (b.daysSince||0)-(a.daysSince||0); });
  if(!list.length){ $('card').innerHTML='<div class="loading">No customers with orders yet.</div>'; return; }
  var rows=list.map(function(c){
    var wa=digits(c.phone)?('<a class="wa" href="https://wa.me/'+digits(c.phone)+'" target="_blank">WhatsApp</a>'):'';
    var star=c.vip?'<span class="vipstar">\u2B50</span> ':'';
    var ro = c.reorder?(esc(c.reorder)+(c.cadenceEst?' <span class="sub" style="display:inline">est</span>':'')):'—';
    return '<tr><td class="cust"><a href="/dashboard/customer?c='+encodeURIComponent(c.phone||'')+'" style="color:#C9A55C">'+star+(esc(c.name)||'—')+'</a><span class="sub">'+esc(c.phone||'')+'</span></td>'+
      '<td><span class="rc '+c._r.cls+'">'+c._r.txt+'</span></td>'+
      '<td>'+(c.lastContact?fmtDate(c.lastContact):'—')+(c.lastSentiment?(' '+emoji(c.lastSentiment)):'')+'</td>'+
      '<td>'+(c.nextFollowup?fmtDate(c.nextFollowup):'—')+'</td>'+
      '<td>'+ro+'</td>'+
      '<td class="r">'+(c.daysSince!=null?c.daysSince+'d':'—')+'</td>'+
      '<td class="r">'+money(c.totalSpent)+'</td>'+
      '<td>'+wa+'</td></tr>';
  }).join('');
  $('card').innerHTML='<table><thead><tr><th>Customer</th><th>Priority</th><th>Last contact</th><th>Next</th><th>Reorder ~</th><th class="r">Days</th><th class="r">Spent</th><th></th></tr></thead><tbody>'+rows+'</tbody></table>';
}
function renderOccasions(){
  var now=new Date(TODAY+'T00:00:00');
  var list=HOLIDAYS.map(function(h){ var du=Math.round((new Date(h.d+'T00:00:00')-now)/DAY); var ob=new Date(h.d+'T00:00:00'); ob.setDate(ob.getDate()-10); return {h:h,du:du,orderBy:ob.toISOString().slice(0,10)}; }).filter(function(x){return x.du>=-2;}).sort(function(a,b){return a.du-b.du;});
  var next=null; for(var i=0;i<list.length;i++){ if(list[i].h.big && list[i].du>=0){ next=list[i]; break; } }
  var cta='';
  if(next){ cta='<div class="note"><b>Next big one: '+esc(next.h.n)+'</b> in '+next.du+' days ('+esc(next.h.d)+'). Order-by ~'+esc(next.orderBy)+' for frozen delivery. Suggested message:<br><br>"Hi [Name]! '+esc(next.h.n)+' is coming up — make the meal unforgettable with premium Argentine Angus, Glatt kosher, delivered frozen. Order early so we lock in your delivery. Want me to set aside your favorite cuts?"</div>'; }
  var rows=list.map(function(x){ var h=x.h; var act=(x.du<=21&&x.du>=0)?' actrow':''; var tg=h.t==='US'?'<span class="tag us">US</span>':'<span class="tag ko">Kosher</span>';
    return '<tr class="'+act.trim()+'"><td class="cust">'+(h.big?'<span class="vipstar">\u2B50</span> ':'')+esc(h.n)+'</td><td>'+tg+'</td><td>'+esc(h.d)+'</td><td class="r">'+(x.du===0?'today':(x.du<0?'passed':x.du+'d'))+'</td><td>'+esc(x.orderBy)+'</td></tr>';
  }).join('');
  $('card').innerHTML=cta+'<table><thead><tr><th>Occasion</th><th>Type</th><th>Date</th><th class="r">In</th><th>Order by</th></tr></thead><tbody>'+rows+'</tbody></table><div class="note" style="margin-top:12px">Plus <b>every Shabbat</b> (Friday) — the weekly meat moment. \u2B50 = biggest for premium beef.</div>';
}
function render(){ if(mode==='followup') renderFollowups(); else if(mode==='occasions') renderOccasions(); else renderStd(); }
function loadFollowups(){
  fetch('/api/order-update',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'followups_list'})}).then(function(r){return r.json();}).then(function(d){ FUP=(d&&d.items)||[]; if(mode==='followup') renderFollowups(); }).catch(function(){ if(mode==='followup') $('card').innerHTML='<div class="loading">Connection error.</div>'; });
}
function load(){
  fetch('/api/orders').then(function(r){return r.json();}).then(function(d){
    var orders=(d&&d.orders)||[]; CUST=build(orders);
    var spent=0,owe=0; CUST.forEach(function(c){spent+=c.spent;owe+=c.owes;});
    $('k-count').textContent=CUST.length; $('k-spent').textContent=money(spent);
    $('k-avg').textContent=money(CUST.length?spent/CUST.length:0); $('k-owe').textContent=money(owe);
    if(mode!=='followup'&&mode!=='occasions') render();
  }).catch(function(){ if(mode!=='followup'&&mode!=='occasions') $('card').innerHTML='<div class="loading">Connection error.</div>'; });
}
function tab(id,m){ $(id).addEventListener('click',function(){ mode=m; ['t-followup','t-occasions','t-all','t-owe','t-lapsed'].forEach(function(x){$(x).classList.toggle('sel',x===id);}); render(); }); }
tab('t-followup','followup'); tab('t-occasions','occasions'); tab('t-all','all'); tab('t-owe','owe'); tab('t-lapsed','lapsed');
loadFollowups(); load();
})();
</script>
</body>
</html>
