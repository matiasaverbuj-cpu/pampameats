<!DOCTYPE html>
<html lang="en"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pampa Meats — Customer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box}
body{margin:0;font-family:'Inter',-apple-system,sans-serif;background:#0A0A0A;color:#F5EFE5;line-height:1.55;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
.serif{font-family:'Cormorant Garamond',Georgia,serif}
.top{display:flex;justify-content:space-between;align-items:center;padding:16px 22px;border-bottom:0.5px solid #242424;background:#000;position:sticky;top:0;z-index:50}
.brand{font-family:'Cormorant Garamond',serif;font-size:17px;font-weight:600;letter-spacing:2.5px;color:#C9A55C}
.brand span{color:#6E6347;font-weight:400}
.back{font-size:12px;letter-spacing:.5px;color:#C9A55C;border:0.5px solid #3a352b;padding:7px 12px;border-radius:6px}
.wrap{max-width:920px;margin:0 auto;padding:26px 22px 60px}
.hd .nm{font-family:'Cormorant Garamond',serif;font-size:34px;color:#F5EFE5}
.hd .meta{font-size:13px;color:#B8A985;margin-top:8px;line-height:1.9}
.hd .meta b{color:#8A7548;font-weight:500}
.stagebar{margin-top:12px;display:flex;gap:8px;flex-wrap:wrap}
.chip{font-size:11px;padding:4px 11px;border-radius:20px;background:#1c1a12;color:#C9A55C;border:0.5px solid #3a352b}
.chip.vip{background:#2a2110;color:#F0C468;border-color:#5a4a22}
.chip.risk{background:#2a1414;color:#E9A8A2;border-color:#5a2a2a}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;margin:22px 0 8px}
.kpi{background:#141414;border:0.5px solid #262626;border-radius:12px;padding:16px}
.kpi .k{font-size:10px;letter-spacing:1.5px;text-transform:uppercase;color:#8A7548;margin-bottom:8px}
.kpi .v{font-family:'Cormorant Garamond',serif;font-size:25px;color:#C9A55C}
.sec-t{font-size:11px;letter-spacing:2px;text-transform:uppercase;color:#8A7548;margin:28px 0 12px}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th{text-align:left;color:#8A7548;font-size:10px;letter-spacing:1px;text-transform:uppercase;padding:8px 10px;border-bottom:0.5px solid #242424}
td{padding:10px;border-bottom:0.5px solid #1c1c1c;color:#EDE3CC}
.pill{font-size:11px;padding:3px 9px;border-radius:20px;background:#1c1a12;color:#C9A55C;border:0.5px solid #3a352b;white-space:nowrap}
.intx{background:#141414;border:0.5px solid #262626;border-radius:12px;padding:13px 16px;margin-bottom:10px}
.intx .ih{display:flex;justify-content:space-between;font-size:11px;color:#8A7548;letter-spacing:.5px;margin-bottom:5px}
.intx .ib{font-size:14px;color:#EDE3CC}
.intx .nx{font-size:11px;color:#C9A55C;margin-top:6px}
.form{background:#12100a;border:0.5px solid #3a352b;border-radius:12px;padding:16px;margin-bottom:22px}
.form label{display:block;font-size:10px;letter-spacing:1.5px;text-transform:uppercase;color:#8A7548;margin:0 0 5px}
.form select,.form textarea,.form input{width:100%;background:#0F0F0F;border:0.5px solid #2a2a2a;border-radius:8px;color:#F5EFE5;padding:10px 12px;font-family:inherit;font-size:14px;margin-bottom:12px}
.form textarea{min-height:70px;resize:vertical}
.btn{background:#C9A55C;color:#1A1208;font-weight:600;font-size:12px;letter-spacing:1px;text-transform:uppercase;padding:12px 22px;border-radius:6px;border:none;cursor:pointer}
.muted{color:#8A7548;font-size:13px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
</style>
</head><body>
<div class="top"><a class="brand" href="/dashboard">PAMPA <span>MEATS</span></a><a class="back" href="/dashboard/customers">&larr; Customers</a></div>
<div class="wrap">
<div class="hd"><div class="nm serif" id="cnm">Customer</div><div class="meta" id="cmeta"></div><div class="stagebar" id="stage"></div></div>
<div class="kpis" id="kpis"></div>

<div class="sec-t">Client Book &mdash; personal touch</div>
<div class="form">
<div class="row2">
<div><label>Preferred doneness</label><input id="cb-done" placeholder="ej. Medium rare"></div>
<div><label>Typical occasion</label><input id="cb-occ" placeholder="ej. Shabbat, fiestas"></div>
</div>
<div class="row2"><div><label>Avoids / not consumed</label><input id="cb-avoid" placeholder="e.g. no filet"></div><div><label>Preferred channel</label><select id="cb-chan"><option value=""></option><option>WhatsApp</option><option>Call</option><option>Email</option></select></div></div>
<label>Personal notes (family, preferences, allergies, delivery)</label>
<textarea id="cb-notes" placeholder="Anything that helps deliver a personal touch..."></textarea>
<div style="display:flex;align-items:center;gap:12px"><button class="btn" id="cbSave">Save Client Book</button><span class="muted" id="cbMsg"></span></div>
</div>

<div class="sec-t">Order history</div>
<div id="orders"><div class="muted">Loading...</div></div>

<div class="sec-t">Log a contact</div>
<div class="form">
<div class="row2">
<div><label>Channel</label><select id="f-ch"><option>WhatsApp</option><option>Call</option><option>Email</option><option>Note</option></select></div>
<div><label>Mood / feedback</label><select id="f-rate"><option value="">&mdash;</option><option value="Good">Good</option><option value="Neutral">Neutral</option><option value="Bad">Bad</option></select></div>
</div>
<div class="row2"><div><label>Type</label><select id="f-type"><option value=""></option><option>Note</option><option>Question</option><option>Complaint</option><option>Suggestion</option><option>Support</option></select></div><div><label>Case status</label><select id="f-status"><option value=""></option><option>Open</option><option>Pending</option><option>Closed</option></select></div></div>
<label>Feedback / note</label>
<textarea id="f-note" placeholder="What happened? (e.g. Loved the picanha, wants to reorder for the next asado)"></textarea>
<div class="row2">
<div><label>Contact date</label><input id="f-cdate" type="date"></div>
<div><label>Next contact / planned purchase</label><input id="f-ndate" type="date"></div>
</div>
<div class="row2"><div><label>Logged by</label><input id="f-by" placeholder="Your name"></div><div style="display:flex;align-items:flex-end"><button class="btn" id="addBtn" style="width:100%">Add interaction</button></div></div>
</div>
<div id="intx"><div class="muted">Loading...</div></div>
<div id="intxEditor" style="display:none;margin-top:10px" class="form"></div>
<div class="sec-t">Timeline</div>
<div id="timeline"><div class="muted">Loading...</div></div>
</div>
<script>
(function(){
var key=(new URLSearchParams(location.search).get('c')||'').trim();
var norm=function(s){return String(s==null?'':s).replace(/[^0-9]/g,'').slice(-10);};
var usd=function(n){return '$'+Math.round(n||0).toLocaleString('en-US');};
var CUTS=[['picanha','Picanha'],['topSirloin','Top Sirloin'],['nyStrip','NY Strip'],['tenderloin','Tenderloin']];
function esc(s){return String(s==null?'':s);}
function kpi(k,v){return '<div class="kpi"><div class="k">'+k+'</div><div class="v serif">'+v+'</div></div>';}
function emoji(r){ if(r==='Good')return '\uD83D\uDE0A'; if(r==='Neutral')return '\uD83D\uDE10'; if(r==='Bad')return '\u2639\uFE0F'; return ''; }
var TODAY=new Date().toISOString().slice(0,10);
function openDelEditor(ix){
  var o=(window.__ORD__||[])[ix]; if(!o) return;
  var box=document.getElementById('delEditor'); if(!box) return;
  var sel=['Preparing','In transit','Delivered','Delayed','Cancelled'];
  var cur=o.deliveryStatus||(o.delivered?'Delivered':'');
  function esc2(s){return String(s==null?'':s).replace(/"/g,'&quot;');}
  var opts='<option value=""></option>'+sel.map(function(s){return '<option '+(s===cur?'selected':'')+'>'+s+'</option>';}).join('');
  box.innerHTML='<div class="sec-t" style="margin-top:0">Delivery</div>'+
    '<div class="row2"><div><label>Delivery status</label><select id="de-st">'+opts+'</select></div>'+
    '<div><label>Delivery date</label><input id="de-date" type="date" value="'+esc2((o.deliveryDate||'').slice(0,10))+'"></div></div>'+
    '<div class="row2"><div><label>Courier</label><input id="de-cou" value="'+esc2(o.courier||'')+'"></div>'+
    '<div><label>Tracking</label><input id="de-trk" value="'+esc2(o.tracking||'')+'"></div></div>'+
    '<label>Order notes / observations</label><textarea id="de-notes">'+esc2(o.csNotes||'')+'</textarea>'+
    '<div style="display:flex;gap:12px;align-items:center"><button class="btn" id="de-save">Save delivery</button><button class="btn" id="de-cancel" style="background:#2a2a2a;color:#C9A55C">Cancel</button><span class="muted" id="de-msg"></span></div>';
  box.style.display='block';
  document.getElementById('de-cancel').onclick=function(){ box.style.display='none'; };
  document.getElementById('de-save').onclick=function(){
    var btn=this; btn.disabled=true; document.getElementById('de-msg').textContent='Saving...';
    var st=document.getElementById('de-st').value;
    var body={id:o.id, deliveryStatus:st, deliveryDate:document.getElementById('de-date').value, courier:document.getElementById('de-cou').value.trim(), tracking:document.getElementById('de-trk').value.trim(), csNotes:document.getElementById('de-notes').value};
    if(st==='Delivered') body.delivered=true;
    if(st==='Cancelled') body.delivered=false;
    fetch('/api/order-update',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)}).then(function(r){return r.json();}).then(function(res){ btn.disabled=false; if(res&&res.ok){ document.getElementById('de-msg').textContent='Saved'; loadOrders(); setTimeout(function(){ if(box) box.style.display='none'; },700);} else { document.getElementById('de-msg').textContent='Could not save'; } }).catch(function(){ btn.disabled=false; document.getElementById('de-msg').textContent='Connection error'; });
  };
  box.scrollIntoView({behavior:'smooth',block:'nearest'});
}
function openIntxEditor(ix){
  var it=(window.__INTX__||[])[ix]; if(!it) return;
  var box=document.getElementById('intxEditor'); if(!box) return;
  function e2(s){return String(s==null?'':s).replace(/"/g,'&quot;');}
  function opt(list,cur){ return list.map(function(s){return '<option '+(s===cur?'selected':'')+'>'+s+'</option>';}).join(''); }
  box.innerHTML='<div class="sec-t" style="margin-top:0">Edit interaction</div>'+
    '<div class="row2"><div><label>Type</label><select id="ie-type"><option value=""></option>'+opt(['Note','Question','Complaint','Suggestion','Support'],it.type||'')+'</select></div>'+
    '<div><label>Case status</label><select id="ie-status"><option value=""></option>'+opt(['Open','Pending','Closed'],it.status||'')+'</select></div></div>'+
    '<label>Note</label><textarea id="ie-note">'+e2(it.note||'')+'</textarea>'+
    '<div style="display:flex;gap:12px;align-items:center"><button class="btn" id="ie-save">Save</button><button class="btn" id="ie-cancel" style="background:#2a2a2a;color:#C9A55C">Cancel</button><span class="muted" id="ie-msg"></span></div>';
  box.style.display='block';
  document.getElementById('ie-cancel').onclick=function(){ box.style.display='none'; };
  document.getElementById('ie-save').onclick=function(){
    var btn=this; btn.disabled=true; document.getElementById('ie-msg').textContent='Saving...';
    fetch('/api/order-update',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'interaction_update',intId:it.id,note:document.getElementById('ie-note').value,type:document.getElementById('ie-type').value,status:document.getElementById('ie-status').value})}).then(function(r){return r.json();}).then(function(res){ btn.disabled=false; if(res&&res.ok){ box.style.display='none'; loadIntx(); } else { document.getElementById('ie-msg').textContent='Could not save'; } }).catch(function(){ btn.disabled=false; document.getElementById('ie-msg').textContent='Connection error'; });
  };
  box.scrollIntoView({behavior:'smooth',block:'nearest'});
}
function renderTimeline(){
  var tl=document.getElementById('timeline'); if(!tl) return;
  var ev=[];
  (window.__ORD__||[]).forEach(function(o){ if(o.date) ev.push({d:String(o.date).slice(0,10), t:'Order placed ('+usd(o.total)+')'}); if(o.deliveryStatus||o.delivered){ ev.push({d:String(o.deliveryDate||o.date).slice(0,10), t:'Delivery: '+(o.deliveryStatus||'Delivered')}); } });
  (window.__INTX__||[]).forEach(function(it){ ev.push({d:String(it.date||'').slice(0,10), t:(it.type||it.channel||'Note')+(it.note?': '+String(it.note).slice(0,60):'')+(it.status?' ['+it.status+']':'')}); });
  ev=ev.filter(function(x){return x.d;}).sort(function(a,b){return String(b.d).localeCompare(String(a.d));});
  if(!ev.length){ tl.innerHTML='<div class="muted">No activity yet.</div>'; return; }
  tl.innerHTML=ev.map(function(x){ return '<div style="display:flex;gap:12px;padding:6px 0;border-bottom:0.5px solid #1c1c1c;font-size:13px"><span style="color:#8A7548;min-width:92px">'+esc(x.d)+'</span><span style="color:#EDE3CC">'+esc(x.t)+'</span></div>'; }).join('');
}
function loadOrders(){
  fetch('/api/orders',{cache:'no-store'}).then(function(r){return r.json();}).then(function(d){
    var all=(d.orders||[]).filter(function(o){return norm(o.phone)===norm(key);});
    if(!all.length){ document.getElementById('cnm').textContent='Customer not found'; document.getElementById('orders').innerHTML='<div class="muted">No orders for this phone.</div>'; return; }
    all.sort(function(a,b){return String(b.date||'').localeCompare(String(a.date||''));});
    var latest=all[0];
    document.getElementById('cnm').textContent=latest.name||'Customer';
    var spent=0,bal=0,fav={};
    all.forEach(function(o){ spent+=(+o.total||0); bal+=(+o.balance||0); CUTS.forEach(function(c){ fav[c[0]]=(fav[c[0]]||0)+(+o[c[0]]||0); }); });
    var favName='-',favMax=0; CUTS.forEach(function(c){ if(fav[c[0]]>favMax){favMax=fav[c[0]];favName=c[1];} });
    var waLink=String(latest.phone||'').replace(/[^0-9]/g,'');
    document.getElementById('cmeta').innerHTML='<b>Phone:</b> '+esc(latest.phone)+' &nbsp; <b>Email:</b> '+esc(latest.email||'-')+'<br><b>Address:</b> '+esc(latest.address||'-')+' ('+esc(latest.zone||'-')+')'+(waLink?' &nbsp; <a href="https://wa.me/'+waLink+'" target="_blank" style="color:#25D366;border:0.5px solid #2c5a2c;padding:4px 12px;border-radius:6px;font-size:12px;text-decoration:none;white-space:nowrap;">WhatsApp</a>':'');
    document.getElementById('kpis').innerHTML=kpi('Orders',all.length)+kpi('Total spent',usd(spent))+kpi('Balance',usd(bal))+kpi('Favorite cut',favName)+kpi('Last order',latest.date||'-');
    var days = latest.date ? Math.floor((Date.now()-new Date(latest.date).getTime())/86400000) : null;
    var st=''; if(spent>=1500) st+='<span class="chip vip">\u2B50 VIP</span>';
    if(days!=null && days>30) st+='<span class="chip risk">At risk &middot; '+days+'d no order</span>'; else if(days!=null) st+='<span class="chip">Active &middot; '+days+'d</span>';
    document.getElementById('stage').innerHTML=st;
    window.__ORD__ = all;
    var rows=all.map(function(o,ix){
      var cuts=CUTS.filter(function(c){return (+o[c[0]]||0)>0;}).map(function(c){return c[1]+' x'+o[c[0]];}).join(', ')||'-';
      var dst=o.deliveryStatus||(o.delivered?'Delivered':'');
      return '<tr><td>'+esc(o.date||'')+'</td><td>'+cuts+'</td><td>'+usd(o.total)+'</td><td><span class="pill">'+esc(o.status||'-')+'</span></td><td>'+(dst?esc(dst):'-')+'</td><td style="text-align:center"><input type="checkbox" class="dlv" data-id="'+esc(o.id||'')+'" '+(o.delivered?'checked':'')+'></td><td><a href="#" class="dedit" data-ix="'+ix+'" style="color:#C9A55C;font-size:12px">Edit</a></td></tr>';
    }).join('');
    document.getElementById('orders').innerHTML='<table><thead><tr><th>Date</th><th>Cuts</th><th>Total</th><th>Status</th><th>Delivery</th><th>Delivered</th><th></th></tr></thead><tbody>'+rows+'</tbody></table><div id="delEditor" style="display:none;margin-top:14px" class="form"></div>';
    document.querySelectorAll('#orders .dlv').forEach(function(cb){ cb.addEventListener('change',function(){ var id=cb.getAttribute('data-id'); cb.disabled=true; fetch('/api/order-update',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({id:id,delivered:cb.checked})}).then(function(r){return r.json();}).then(function(res){ cb.disabled=false; if(!res||!res.ok){ cb.checked=!cb.checked; } }).catch(function(){ cb.disabled=false; cb.checked=!cb.checked; }); }); });
    document.querySelectorAll('#orders .dedit').forEach(function(a){ a.addEventListener('click',function(e){ e.preventDefault(); openDelEditor(parseInt(a.getAttribute('data-ix'),10)); }); });
    renderTimeline();
  }).catch(function(){ document.getElementById('orders').innerHTML='<div class="muted">Connection error.</div>'; });
}
function loadIntx(){
  fetch('/api/order-update',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'interaction_list',customer:key})}).then(function(r){return r.json();}).then(function(d){
    var items=(d.items||[]);
    if(!items.length){ document.getElementById('intx').innerHTML='<div class="muted">No interactions logged yet.</div>'; return; }
    document.getElementById('intx').innerHTML=items.map(function(it){
      var nx = it.next ? '<div class="nx">Next: '+esc(it.next)+'</div>' : '';
      var em = emoji(it.rating);
      return '<div class="intx"><div class="ih"><span>'+esc(it.channel||'Note')+' &middot; '+esc(it.date||'')+(em?(' &middot; '+em):'')+'</span><span>'+esc(it.by||'')+'</span></div><div class="ib">'+esc(it.note||'')+'</div>'+nx+'</div>';
    }).join('');
  }).catch(function(){ document.getElementById('intx').innerHTML='<div class="muted">Could not load interactions.</div>'; });
}
function loadClientBook(){
  fetch('/api/order-update',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'customer_get',customer:key})}).then(function(r){return r.json();}).then(function(d){
    var p=(d&&d.prefs)||{};
    document.getElementById('cb-done').value=p.doneness||'';
    document.getElementById('cb-occ').value=p.occasion||'';
    document.getElementById('cb-notes').value=p.notes||'';
    document.getElementById('cb-avoid').value=p.avoids||''; document.getElementById('cb-chan').value=p.preferredChannel||'';
  }).catch(function(){});
}
document.getElementById('cbSave').addEventListener('click',function(){
  var btn=this; btn.disabled=true; var msg=document.getElementById('cbMsg'); msg.textContent='Saving...';
  fetch('/api/order-update',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'customer_save',customer:key,name:(document.getElementById('cnm').textContent||''),doneness:document.getElementById('cb-done').value.trim(),occasion:document.getElementById('cb-occ').value.trim(),notes:document.getElementById('cb-notes').value.trim(),avoids:document.getElementById('cb-avoid').value.trim(),preferredChannel:document.getElementById('cb-chan').value})})
  .then(function(r){return r.json();}).then(function(res){ btn.disabled=false; msg.textContent=(res&&res.ok)?'Saved \u2713':'Could not save'; setTimeout(function(){msg.textContent='';},2500); })
  .catch(function(){ btn.disabled=false; msg.textContent='Connection error'; });
});
document.getElementById('addBtn').addEventListener('click',function(){
  var note=document.getElementById('f-note').value.trim();
  var rate=document.getElementById('f-rate').value;
  if(!note && !rate){ document.getElementById('f-note').focus(); return; }
  var btn=this; btn.disabled=true; btn.textContent='Saving...';
  fetch('/api/order-update',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'interaction_add',customer:key,channel:document.getElementById('f-ch').value,note:note,rating:rate,contactDate:document.getElementById('f-cdate').value||TODAY,nextDate:document.getElementById('f-ndate').value,by:document.getElementById('f-by').value.trim(),type:document.getElementById('f-type').value,status:document.getElementById('f-status').value})})
  .then(function(r){return r.json();}).then(function(){ document.getElementById('f-note').value=''; document.getElementById('f-rate').value=''; document.getElementById('f-ndate').value=''; document.getElementById('f-type').value=''; document.getElementById('f-status').value=''; btn.disabled=false; btn.textContent='Add interaction'; loadIntx(); })
  .catch(function(){ btn.disabled=false; btn.textContent='Add interaction'; });
});
if(!key){ document.getElementById('cnm').textContent='No customer selected'; }
else { document.getElementById('f-cdate').value=TODAY; loadOrders(); loadIntx(); loadClientBook(); }
})();
</script>
</body></html>
